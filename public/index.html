<style>
  :root{
    /* Light / Day Theme (Default) */
    --bg:#ffffff;
    --bg-gradient:
      radial-gradient(ellipse 60% 50% at 50% 35%, rgba(0, 0, 0, 0.03) 0%, transparent 80%),
      radial-gradient(ellipse 90% 80% at 50% 100%, rgba(0, 0, 0, 0.02) 0%, transparent 70%);
    --stage-bg:rgba(255, 255, 255, 0.95);
    --stage-border:rgba(0, 0, 0, 0.08);
    --stage-shadow:
      0 24px 60px rgba(0, 0, 0, 0.06),
      0 1px 3px rgba(0, 0, 0, 0.04);
    --stage-inset:inset 0 1px 0 rgba(255, 255, 255, 1);
    --key-bg:linear-gradient(180deg, #ffffff 0%, #f9fafb 100%);
    --key-border:rgba(0, 0, 0, 0.08);
    --key-border-hover:rgba(0, 0, 0, 0.2);
    --key-shadow:
      0 4px 16px rgba(0, 0, 0, 0.04),
      inset 0 1px 0 rgba(255, 255, 255, 0.9);
    --key-shadow-hover:
      0 8px 24px rgba(0, 0, 0, 0.08),
      inset 0 0 12px rgba(0, 0, 0, 0.02);
    --key-color:#09090b;
    --key-color-hover:#000000;
    --key-sub:#71717a;
  }

  @media (prefers-color-scheme: dark){
    :root{
      /* Dark / Evening Theme (Black & Gold) */
      --bg:#070709;
      --bg-gradient:
        radial-gradient(ellipse 60% 50% at 50% 35%, rgba(211, 182, 131, 0.09) 0%, transparent 80%),
        radial-gradient(ellipse 90% 80% at 50% 100%, rgba(211, 182, 131, 0.04) 0%, transparent 70%);
      --stage-bg:radial-gradient(130% 120% at 50% 0%, #151310 0%, #0c0c0e 65%, #080809 100%);
      --stage-border:rgba(211, 182, 131, 0.25);
      --stage-shadow:
        0 32px 80px rgba(0, 0, 0, 0.85),
        0 0 60px rgba(211, 182, 131, 0.08);
      --stage-inset:inset 0 1px 1px rgba(211, 182, 131, 0.35);
      --key-bg:linear-gradient(180deg, rgba(24, 21, 18, 0.85) 0%, rgba(12, 11, 10, 0.9) 100%);
      --key-border:rgba(211, 182, 131, 0.25);
      --key-border-hover:rgba(211, 182, 131, 0.55);
      --key-shadow:
        0 8px 24px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(211, 182, 131, 0.18);
      --key-shadow-hover:
        0 0 25px rgba(211, 182, 131, 0.25),
        inset 0 0 12px rgba(211, 182, 131, 0.12);
      --key-color:#d3b683;
      --key-color-hover:#faecd5;
      --key-sub:#b8b09f;
    }
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    background-color:var(--bg);
    background-image:var(--bg-gradient);
    color:var(--key-color);
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;
    padding:32px;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  .stage{
    width:min(1100px,94vw);
    background:var(--stage-bg);
    border-radius:32px;
    padding:60px 48px 52px;
    border:1px solid var(--stage-border);
    box-shadow:var(--stage-shadow), var(--stage-inset);
    display:flex;flex-direction:column;align-items:center;text-align:center;
    position:relative;
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
  }

  .btn {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 12rem;
    height: 12rem;
    overflow: hidden;
    border-radius: 50%;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease, border-color 0.4s ease;
    border: 1.5px solid rgba(255, 255, 255, 0.18);
    background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    cursor: pointer;
    text-decoration: none;
    outline: none;
    user-select: none;
    -webkit-user-select: none;
  }

  .btn:hover {
    transform: scale(1.06);
    border-color: rgba(255, 255, 255, 0.35);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55), 0 0 30px rgba(27, 39, 53, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.3);
  }

  .btn:active {
    transform: scale(0.98);
  }

  #container-stars {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    border-radius: 50%;
    background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
    pointer-events: none;
  }

  strong {
    position: relative;
    z-index: 2;
    font-family: "Lato", "Poppins", sans-serif;
    font-weight: 300;
    font-size: 15px;
    letter-spacing: 4px;
    color: #FFFFFF;
    text-shadow: 0 0 12px rgba(0, 0, 0, 0.9), 0 2px 4px rgba(0, 0, 0, 0.8);
