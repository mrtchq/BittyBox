<style>
  :root{
    /* Light / Day Theme (Default) */
    --bg:#ffffff;
    --bg-gradient:
      radial-gradient(ellipse 60% 50% at 50% 35%, rgba(0, 0, 0, 0.03) 0%, transparent 80%),
      radial-gradient(ellipse 90% 80% at 50% 100%, rgba(0, 0, 0, 0.02) 0%, transparent 70%);
    --stage-bg:rgba(255, 255, 255, 0.95);
    --stage-border:rgba(0, 0, 0, 0.08);
    --stage-shadow:
      0 24px 60px rgba(0, 0, 0, 0.06),
      0 1px 3px rgba(0, 0, 0, 0.04);
    --stage-inset:inset 0 1px 0 rgba(255, 255, 255, 1);
  }

  @media (prefers-color-scheme: dark){
    :root{
      /* Dark / Evening Theme (Black & Gold) */
      --bg:#070709;
      --bg-gradient:
        radial-gradient(ellipse 60% 50% at 50% 35%, rgba(211, 182, 131, 0.09) 0%, transparent 80%),
        radial-gradient(ellipse 90% 80% at 50% 100%, rgba(211, 182, 131, 0.04) 0%, transparent 70%);
      --stage-bg:radial-gradient(130% 120% at 50% 0%, #151310 0%, #0c0c0e 65%, #080809 100%);
      --stage-border:rgba(211, 182, 131, 0.25);
      --stage-shadow:
        0 32px 80px rgba(0, 0, 0, 0.85),
        0 0 60px rgba(211, 182, 131, 0.08);
      --stage-inset:inset 0 1px 1px rgba(211, 182, 131, 0.35);
    }
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    background-color:var(--bg);
    background-image:var(--bg-gradient);
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;
    padding:32px;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  .stage{
    width:min(1100px,94vw);
    background:var(--stage-bg);
    border-radius:32px;
    padding:60px 48px 52px;
    border:1px solid var(--stage-border);
    box-shadow:var(--stage-shadow), var(--stage-inset);
    display:flex;flex-direction:column;align-items:center;text-align:center;
    position:relative;
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
  }

  .btn {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 17.5rem;
    height: 17.5rem;
    overflow: hidden;
    background-size: 700% 700%;
    backdrop-filter: blur(1rem);
    -webkit-backdrop-filter: blur(1rem);
    border-radius: 50%;
    transition: 0.5s;
    animation: gradient_301 5s ease infinite;
    border: double 4px transparent;
    background-image: linear-gradient(#000000, #000000), linear-gradient(137.48deg, #d3b683 10%, #a07840 45%, #000000 67%, #d3b683 87%);
    background-origin: border-box;
    background-clip: content-box, border-box;
    background-color: #000000;
    cursor: pointer;
    text-decoration: none;
    outline: none;
    user-select: none;
    -webkit-user-select: none;
  }

  #container-stars {
    position: absolute;
    inset: 0;
    z-index: 1;
    width: 100%;
    height: 100%;
    overflow: hidden;
    transition: 0.5s;
    backdrop-filter: blur(1rem);
    -webkit-backdrop-filter: blur(1rem);
    border-radius: 50%;
    background-color: #000000;
    pointer-events: none;
  }

  strong {
    z-index: 2;
    font-family: 'Poppins, 'Lato, sans-serif;
    font-size: 22px;
    letter-spacing: 3.5px;
    color: #FFFFFF;
    text-shadow: 0 0 6px rgba(0, 0, 0, 0.9), 0 0 12px rgba(0, 0, 0, 0.8);
    pointer-events: none;
    text-align: center;
  }

  #glow {
    position: absolute;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .circle {
    position: absolute;
    width: 75%;
    height: 75%;
    filter: blur(2.5rem);
    animation: pulse_3011 4s infinite;
    z-index: 0;
    border-radius: 50%;
  }

  .circle:nth-of-type(1) {
    background: rgba(211, 182, 131, 0.25);
  }

  .circle:nth-of-type(2) {
    background: rgba(160, 120, 60, 0.2);
  }

  .btn:hover #container-stars {
    z-index: 1;
    background-color: #000000;
  }

  .btn:hover {
    transform: scale(1.06);
  }

  .btn:active {
    border: double 4px #d3b683;
    background-origin: border-box;
    background-clip: content-box, border-box;
    animation: none;
  }

  .btn:active .circle {
    background: #4a3820;
  }
