<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: https: 'unsafe-inline' 'unsafe-eval'; img-src data: 'self' https: blob:; media-src data: https: blob:; frame-src *; script-src cdnjs.cloudflare.com cdn.jsdelivr.net unpkg.com 'self' 'unsafe-inline' 'unsafe-eval'; connect-src https://codepen.io https://cdn.jsdelivr.net https://unpkg.com *; font-src https://fonts.gstatic.com *; style-src https://fonts.googleapis.com cdnjs.cloudflare.com cdn.jsdelivr.net unpkg.com 'unsafe-inline' 'self'">
<meta id="themeColor" name="theme-color" content="#f1f1f1" media="(prefers-color-scheme: light)">
<meta id="themeColorDark" name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<link rel="canonical" id="canonical" href="/edit">

<title>Bitty box</title>
<link rel="stylesheet" type="text/css" href="edit.css">
<link rel="stylesheet" type="text/css" href="ghost-cards.css">
<link id="favicon" rel="icon" href='/favicon.svg'>

<!-- Editor.js Core -->
<script src="https://cdn.jsdelivr.net/npm/@editorjs/editorjs@latest"></script>

<!-- Editor.js Official Plugins -->
<script src="https://cdn.jsdelivr.net/npm/@editorjs/header@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/list@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/checklist@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/quote@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/delimiter@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/table@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/marker@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/inline-code@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/underline@latest"></script>

<!-- Utilities -->
<script src="/js/crypto-js.min.js"></script>
<script src="/js/lzma/lzma_worker-min.js"></script>

<!-- Main Editor Module -->
<script src="/edit.js" type="module"></script>
<link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">
</head>

<body>
<iframe class="hide-before-edit" id="preview-frame"></iframe>

<div class="editor-container">
  <div id="doc-file"></div>
  <input id="file-input" type="file" name="name" style="display: none;" />
  <div id="drop-zone"></div>

  <div id="copy-message">Link copied to clipboard.</div>

  <div id="doc-title" class="toolbarbutton hide-before-edit" placeholder="untitled"> 
    <div class="title" id="doc-title-text"></div>
    <form id="md-contents" class="menu">
      <div class="inputrow"><label for="md-title">title</label><input type="text" name="title" id="md-title" placeholder="untitled"><input title="Include link metadata" type="checkbox" name="includeMetadata" id="md-include" value="true" checked></div>
      <div class="inputrow metadata-on"><label for="md-description">description</label><input type="text" name="description" id="md-description" placeholder="text"></div>
      <div class="inputrow metadata-on"><label for="md-favicon">favicon</label><input type="text" name="favicon" id="md-favicon" placeholder="emoji or url"></div>
      <div class="inputrow metadata-on"><label for="md-image">image</label><input type="text" name="image" id="md-image" placeholder="image url"></div>
      <div class="inputrow"><label for="md-password">password</label><input type="text" name="password" id="md-password" placeholder="encryption password"></div>
    </form>
  </div>

  <!-- Editor.js Container -->
  <div id="editorjs"></div>

  <div class="toolbar" id="menubar">
    <div class="toolbar-right">
      <div id="preview" class="hide-before-edit menu-item" title="Toggle Live Preview">Preview</div>
      <div id="copy" class="hide-before-edit menu-item" title="Copy Shareable Link">Copy Link</div>
      <div id="length" class="hide-before-edit menu-item"></div>
    </div>
  </div>
</div>
</body>
</html>
